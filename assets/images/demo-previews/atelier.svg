<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="ATELIER - Independent Creative Designer / Art Director demo preview">
  <defs>
    <linearGradient id="atPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F3"/>
      <stop offset="1" stop-color="#F2EEE4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#atPaper)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="68" fill="#F7F4ED"/>
  <line x1="0" y1="68" x2="1200" y2="68" stroke="#E0D9CC" stroke-width="1"/>
  <text x="64" y="44" font-family="Newsreader, Times, serif" font-size="22" font-style="italic" font-weight="400" fill="#1A1814">Atelier</text>
  <text x="540" y="44" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3A352E">Work</text>
  <text x="600" y="44" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3A352E">About</text>
  <text x="660" y="44" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3A352E">Journal</text>
  <text x="725" y="44" font-family="Inter, Arial, sans-serif" font-size="11" fill="#3A352E">Contact</text>
  <text x="980" y="44" font-family="Newsreader, Times, serif" font-size="12" font-style="italic" fill="#A04A2A">Available for selected projects →</text>

  <!-- Eyebrow -->
  <text x="64" y="128" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#8C8478">CREATIVE DIRECTOR &amp; DESIGNER</text>
  <text x="1136" y="128" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#8C8478" text-anchor="end">BASED BETWEEN EUROPE &amp; ASIA</text>

  <!-- Hero: large serif typography -->
  <text x="60" y="230" font-family="Newsreader, Times, serif" font-size="58" font-weight="400" letter-spacing="-1.5" fill="#1A1814">I create visual</text>
  <text x="60" y="290" font-family="Newsreader, Times, serif" font-size="58" font-style="italic" font-weight="400" letter-spacing="-1.5" fill="#1A1814">identities,</text>
  <text x="60" y="350" font-family="Newsreader, Times, serif" font-size="58" font-weight="400" letter-spacing="-1.5" fill="#1A1814">digital experiences</text>
  <text x="60" y="410" font-family="Newsreader, Times, serif" font-size="58" font-weight="400" letter-spacing="-1.5" fill="#1A1814">and images for</text>
  <text x="60" y="470" font-family="Newsreader, Times, serif" font-size="58" font-weight="400" letter-spacing="-1.5" fill="#1A1814">ambitious brands.</text>

  <!-- Supporting italic + CTA -->
  <text x="60" y="520" font-family="Newsreader, Times, serif" font-size="14" font-style="italic" fill="#8C8478">An independent creative practice working at the intersection of identity, digital and art direction.</text>
  <rect x="60" y="544" width="150" height="38" fill="#1A1814"/>
  <text x="135" y="568" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.2" fill="#F7F4ED" text-anchor="middle">VIEW SELECTED WORK</text>
  <rect x="222" y="544" width="130" height="38" fill="none" stroke="#1A1814" stroke-width="1"/>
  <text x="287" y="568" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.2" fill="#1A1814" text-anchor="middle">ABOUT THE STUDIO</text>

  <!-- Portrait (right) -->
  <rect x="820" y="120" width="300" height="400" fill="#E8E2D5"/>
  <circle cx="970" cy="280" r="60" fill="#C9BFA8" opacity="0.6"/>
  <path d="M870 480 Q920 380 970 420 T1080 400 L1080 520 L870 520 Z" fill="#B5A88C" opacity="0.5"/>
  <text x="820" y="540" font-family="Newsreader, Times, serif" font-size="11" font-style="italic" fill="#8C8478">Studio portrait - Spring 2026</text>

  <!-- Divider -->
  <line x1="64" y1="610" x2="1136" y2="610" stroke="#E0D9CC" stroke-width="1"/>

  <!-- Selected Work section -->
  <text x="64" y="644" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.5" fill="#8C8478">SELECTED WORK - 2024 / 2026</text>
  <text x="64" y="688" font-family="Newsreader, Times, serif" font-size="40" font-weight="400" letter-spacing="-1" fill="#1A1814">Selected Work</text>

  <!-- Project thumbnails -->
  <rect x="64" y="712" width="340" height="60" fill="#E8E2D5"/>
  <text x="74" y="728" font-family="Inter, Arial, sans-serif" font-size="7" letter-spacing="1.5" fill="#8C8478">01 - FORMA</text>
  <text x="74" y="760" font-family="Newsreader, Times, serif" font-size="14" fill="#1A1814">Brand Identity · 2026 →</text>

  <rect x="424" y="712" width="220" height="60" fill="#D9D1BE"/>
  <text x="434" y="728" font-family="Inter, Arial, sans-serif" font-size="7" letter-spacing="1.5" fill="#8C8478">02 - MAISON 24</text>
  <text x="434" y="760" font-family="Newsreader, Times, serif" font-size="12" fill="#1A1814">Art Direction · 2026 →</text>

  <rect x="664" y="712" width="220" height="60" fill="#E0D9CC"/>
  <text x="674" y="728" font-family="Inter, Arial, sans-serif" font-size="7" letter-spacing="1.5" fill="#8C8478">03 - NOIR OBJECTS</text>
  <text x="674" y="760" font-family="Newsreader, Times, serif" font-size="12" fill="#1A1814">Digital · 2025 →</text>

  <!-- Clay accent dot -->
  <circle cx="1120" cy="130" r="4" fill="#A04A2A"/>
</svg>
