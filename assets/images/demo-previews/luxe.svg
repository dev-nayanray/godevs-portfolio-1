<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="LUXE - Fashion Designer / Stylist demo preview">
  <rect width="1200" height="800" fill="#F4F1EA"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#F4F1EA"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#DDD6C8" stroke-width="1"/>
  <text x="600" y="40" font-family="Newsreader, Times, serif" font-size="14" font-weight="400" letter-spacing="4" fill="#1A1814" text-anchor="middle">LUXE</text>
  <text x="500" y="40" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#1A1814">COLLECTIONS</text>
  <text x="660" y="40" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#8A8278">EDITORIAL</text>
  <text x="750" y="40" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#8A8278">ABOUT</text>
  <text x="810" y="40" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#8A8278">JOURNAL</text>
  <text x="1136" y="40" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#9A7B3F" text-anchor="end">INQUIRIES →</text>

  <!-- Hero - asymmetric typography + portrait -->
  <!-- Eyebrow row -->
  <text x="64" y="120" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.6" fill="#9A7B3F">LUXE / 26</text>
  <text x="1136" y="120" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.6" fill="#8A8278" text-anchor="end">INDEPENDENT FASHION PRACTICE</text>

  <!-- Hero typography (left 38%) -->
  <text x="60" y="200" font-family="Newsreader, Times, serif" font-size="42" font-weight="400" letter-spacing="-1" fill="#1A1814">Designed for</text>
  <text x="60" y="250" font-family="Newsreader, Times, serif" font-size="42" font-weight="400" letter-spacing="-1" fill="#1A1814">a world</text>
  <text x="60" y="300" font-family="Newsreader, Times, serif" font-size="42" font-style="italic" font-weight="400" letter-spacing="-0.6" fill="#1A1814">beyond trends.</text>
  <text x="60" y="350" font-family="Inter, Arial, sans-serif" font-size="11" fill="#8A8278">Independent fashion practice exploring</text>
  <text x="60" y="368" font-family="Inter, Arial, sans-serif" font-size="11" fill="#8A8278">identity, material, image and culture.</text>

  <!-- CTAs -->
  <rect x="60" y="390" width="150" height="34" fill="#1A1814"/>
  <text x="135" y="412" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#F4F1EA" text-anchor="middle">EXPLORE COLLECTION →</text>
  <rect x="222" y="390" width="130" height="34" fill="none" stroke="#1A1814" stroke-width="1"/>
  <text x="287" y="412" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#1A1814" text-anchor="middle">VIEW EDITORIAL →</text>

  <!-- Hero portrait (right 62%) -->
  <rect x="540" y="100" width="596" height="460" fill="#EAE5DA"/>
  <!-- fashion figure silhouette -->
  <ellipse cx="838" cy="240" rx="60" ry="70" fill="#3A352E" opacity="0.7"/>
  <path d="M780 310 Q838 300 896 310 L916 480 L760 480 Z" fill="#3A352E" opacity="0.6"/>
  <text x="540" y="585" font-family="Newsreader, Times, serif" font-size="11" font-style="italic" fill="#8A8278">Campaign - Spring / Summer 2026</text>

  <!-- Featured Collection - FORM -->
  <line x1="0" y1="610" x2="1200" y2="610" stroke="#DDD6C8" stroke-width="1"/>
  <text x="64" y="644" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.6" fill="#9A7B3F">COLLECTION 01 - FORM · SPRING / SUMMER 2026</text>
  <text x="64" y="688" font-family="Newsreader, Times, serif" font-size="36" font-weight="400" letter-spacing="-0.8" fill="#1A1814">Form</text>

  <!-- Large featured image -->
  <rect x="64" y="708" width="1072" height="68" fill="#EAE5DA"/>
  <rect x="64" y="708" width="1072" height="68" fill="#3A352E" opacity="0.15"/>
  <ellipse cx="600" cy="745" rx="180" ry="20" fill="#9A7B3F" opacity="0.08"/>
