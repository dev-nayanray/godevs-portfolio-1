  <rect x="416" y="740" width="160" height="40" rx="2" fill="#1A1A1A"/>
  <text x="426" y="756" font-family="JetBrains Mono, Menlo, monospace" font-size="7" fill="#F5F3EE" opacity="0.6">2025 · PRODUCT</text>
  <text x="426" y="770" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F5F3EE">North →</text>

