  <text x="290" y="618" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B6862" opacity="0.7">Google</text>
  <text x="410" y="618" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B6862" opacity="0.7">Spotify</text>
  <text x="540" y="618" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B6862" opacity="0.7">Airbnb</text>
  <text x="650" y="618" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B6862" opacity="0.7">Notion</text>
  <text x="760" y="618" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#6B6862" opacity="0.7">Stripe</text>
  <line x1="64" y1="650" x2="1136" y2="650" stroke="#DCD7CC" stroke-width="1"/>

