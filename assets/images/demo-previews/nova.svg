  <text x="64" y="688" font-family="JetBrains Mono, Menlo, monospace" font-size="9" font-weight="500" letter-spacing="2" fill="#FF5A30">SELECTED WORK - 01</text>
  <text x="64" y="724" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="-1" fill="#0A0A0A">Selected Work</text>

