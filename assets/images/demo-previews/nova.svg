      <stop offset="0" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#EEEAE1"/>
    </linearGradient>
    <linearGradient id="novaInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="1" stop-color="#0A0A0A"/>
