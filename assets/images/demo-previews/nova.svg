  <text x="60" y="350" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="600" letter-spacing="-3" fill="#0A0A0A">experiences that <tspan font-family="Newsreader, Times, serif" font-style="italic" font-weight="500" fill="#0A0A0A">matter.</tspan></text>

