    <circle cx="760" cy="90" r="1.5"/><circle cx="980" cy="130" r="1.5"/><circle cx="1080" cy="60" r="1.5"/>
    <circle cx="80" cy="300" r="1.5"/><circle cx="600" cy="280" r="1.5"/><circle cx="1120" cy="320" r="1.5"/>
