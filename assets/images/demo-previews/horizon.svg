<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="HORIZON — Travel Photographer / Visual Storyteller demo preview">
  <rect width="1200" height="800" fill="#161310"/>

  <!-- Hero (full-screen dramatic landscape) -->
  <rect x="0" y="0" width="1200" height="560" fill="#2A2520"/>
  <rect x="0" y="0" width="1200" height="560" fill="#0A0908" opacity="0.4"/>
  <!-- mountain silhouettes -->
  <polygon points="0,560 200,300 350,380 500,250 700,350 900,200 1100,320 1200,280 1200,560" fill="#1A1714" opacity="0.7"/>
  <polygon points="0,560 150,400 300,450 450,350 600,420 750,330 900,400 1050,360 1200,420 1200,560" fill="#0E0C0A" opacity="0.8"/>
  <!-- dramatic sky glow -->
  <ellipse cx="600" cy="200" rx="400" ry="60" fill="#C25A2C" opacity="0.08"/>
  <ellipse cx="900" cy="150" rx="200" ry="30" fill="#C25A2C" opacity="0.06"/>

  <!-- Header (floating over hero) -->
  <text x="64" y="48" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.5" fill="#F5F2EB">Horizon</text>
  <text x="540" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.8" fill="#F5F2EB">JOURNEYS</text>
  <text x="610" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.8" fill="rgba(245,242,235,0.5)">STORIES</text>
  <text x="675" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.8" fill="rgba(245,242,235,0.5)">PLACES</text>
  <text x="730" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.8" fill="rgba(245,242,235,0.5)">PHOTOGRAPHY</text>
  <text x="830" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.8" fill="rgba(245,242,235,0.5)">ABOUT</text>
  <text x="980" y="48" font-family="SF Mono, Menlo, monospace" font-size="9" font-weight="500" fill="#C25A2C">AVAILABLE FOR ASSIGNMENTS</text>

  <!-- Hero text (bottom-left) -->
  <text x="64" y="400" font-family="SF Mono, Menlo, monospace" font-size="9" font-weight="500" letter-spacing="1" fill="#C25A2C">TRAVEL / PHOTOGRAPHY / 2026</text>
  <text x="60" y="470" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="600" letter-spacing="-2.7" fill="#F5F2EB">PATAGONIA</text>
  <text x="60" y="510" font-family="Inter, Arial, sans-serif" font-size="16" font-style="italic" font-weight="400" fill="rgba(245,242,235,0.7)">At the edge of the world.</text>
  <rect x="60" y="530" width="150" height="32" fill="#F5F2EB"/>
  <text x="135" y="551" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="1.6" fill="#161310" text-anchor="middle">EXPLORE JOURNEY →</text>

  <!-- Selected Journeys section -->
  <rect x="0" y="560" width="1200" height="240" fill="#F5F2EB"/>
  <text x="64" y="600" font-family="SF Mono, Menlo, monospace" font-size="9" font-weight="500" letter-spacing="1" fill="#C25A2C">SELECTED JOURNEYS</text>
  <text x="64" y="632" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.6" fill="#161310">Selected Journeys</text>

  <!-- Destination cards -->
  <rect x="64" y="656" width="340" height="120" fill="#2A2520"/>
  <rect x="64" y="656" width="340" height="120" fill="#0A0908" opacity="0.3"/>
  <text x="74" y="676" font-family="SF Mono, Menlo, monospace" font-size="7" fill="rgba(245,242,235,0.5)">50°S 73°W</text>
  <text x="74" y="756" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#F5F2EB">PATAGONIA</text>
  <text x="74" y="770" font-family="SF Mono, Menlo, monospace" font-size="7" fill="rgba(245,242,235,0.5)">ARGENTINA + CHILE</text>

  <rect x="420" y="656" width="220" height="120" fill="#1A2520"/>
  <rect x="420" y="656" width="220" height="120" fill="#0A0908" opacity="0.3"/>
  <text x="430" y="756" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F2EB">ICELAND</text>
  <text x="430" y="770" font-family="SF Mono, Menlo, monospace" font-size="7" fill="rgba(245,242,235,0.5)">64°N 21°W</text>

  <rect x="656" y="656" width="220" height="120" fill="#1A2018"/>
  <rect x="656" y="656" width="220" height="120" fill="#0A0908" opacity="0.3"/>
  <text x="666" y="756" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F2EB">KYOTO</text>
  <text x="666" y="770" font-family="SF Mono, Menlo, monospace" font-size="7" fill="rgba(245,242,235,0.5)">35°N 135°E</text>

  <rect x="892" y="656" width="244" height="120" fill="#2A2218"/>
  <rect x="892" y="656" width="244" height="120" fill="#0A0908" opacity="0.3"/>
  <text x="902" y="756" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F2EB">DOLOMITES</text>
  <text x="902" y="770" font-family="SF Mono, Menlo, monospace" font-size="7" fill="rgba(245,242,235,0.5)">46°N 11°E</text>
</svg>
