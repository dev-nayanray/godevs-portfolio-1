  <text x="660" y="775" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D9488">92%</text>

  <rect x="784" y="744" width="340" height="48" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="794" y="762" font-family="SF Mono, Menlo, monospace" font-size="7" fill="#6B7280">E-COMMERCE · WEB · 2024</text>
  <text x="794" y="778" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F1115">Commerce Admin</text>
  <text x="1090" y="775" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D9488">−47%</text>
