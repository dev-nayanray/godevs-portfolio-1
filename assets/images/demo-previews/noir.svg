<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="NOIR — Film Director / Cinematographer demo preview">
  <rect width="1200" height="800" fill="#0A0908"/>

  <!-- Minimal header (floating over hero) -->
  <text x="64" y="48" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#F0EBE3">NOIR</text>
  <text x="540" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#F0EBE3">FILMS</text>
  <text x="600" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#8A8378">DIRECTOR</text>
  <text x="680" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#8A8378">ABOUT</text>
  <text x="740" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#8A8378">JOURNAL</text>
  <text x="810" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#8A8378">CONTACT</text>
  <text x="980" y="48" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.2" fill="#C2422B">AVAILABLE FOR PROJECTS →</text>

  <!-- Hero (full-screen cinematic) -->
  <rect x="0" y="70" width="1200" height="450" fill="#1A1715"/>
  <!-- dramatic light shaft -->
  <polygon points="0,520 500,520 250,140" fill="#C2422B" opacity="0.06"/>
  <ellipse cx="600" cy="280" rx="300" ry="80" fill="#3A2A20" opacity="0.4"/>
  <!-- atmospheric haze -->
  <rect x="0" y="400" width="1200" height="120" fill="#0A0908" opacity="0.6"/>
  <!-- single figure -->
  <rect x="595" y="470" width="4" height="30" fill="#0A0908" opacity="0.7"/>

  <!-- Hero text (bottom-left, minimal) -->
  <text x="64" y="430" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.6" fill="#C2422B">DIRECTOR / FILMMAKER</text>
  <text x="60" y="485" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#F0EBE3">Stories</text>
  <text x="60" y="485" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#F0EBE3" opacity="0">
  </text>
  <text x="280" y="485" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#C2422B">worth</text>
  <text x="60" y="535" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#F0EBE3">remembering.</text>
  <text x="60" y="570" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="2.4" fill="#F0EBE3">COMMERCIALS / NARRATIVE / DOCUMENTARY / MUSIC</text>

  <!-- Showreel section -->
  <text x="64" y="610" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="2.6" fill="#C2422B">SHOWREEL 2026 — 02:14</text>
  <text x="64" y="640" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.6" fill="#F0EBE3">The Reel</text>

  <!-- Showreel poster (21:9 with play button) -->
  <rect x="64" y="660" width="1072" height="80" fill="#1A1715"/>
  <rect x="64" y="660" width="1072" height="80" fill="#0A0908" opacity="0.5"/>
  <!-- play button circle -->
  <circle cx="600" cy="700" r="18" fill="none" stroke="#F0EBE3" stroke-width="1" opacity="0.7"/>
  <polygon points="596,694 596,706 608,700" fill="#F0EBE3" opacity="0.8"/>
  <text x="630" y="704" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="1.8" fill="#F0EBE3">Play Reel →  ·  02:14</text>

  <!-- Selected Work section -->
  <text x="64" y="770" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="500" letter-spacing="2.6" fill="#8A8378">SELECTED WORK — 2023 / 2026</text>
  <text x="64" y="792" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5" fill="#F0EBE3">Selected Work</text>
</svg>
